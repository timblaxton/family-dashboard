<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids' Daily Chores Dashboard</title>
<style>
  :root {
    --bg: #f6f1e7;
    --card: #ffffff;
    --ink: #2d2a26;
    --muted: #8a7f72;
    --green: #5aa469;
    --line: #e8dfd0;
    --gold: #e8a93d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 10px;
    max-width: 880px;
    margin-left: auto;
    margin-right: auto;
  }
  header { text-align: center; margin: 4px 0 8px; }
  header h1 { font-size: 1.2rem; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 0.78rem; }
  .rewards-note {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .rewards-note b { color: var(--gold); }
  #family-progress {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px 14px;
    margin-bottom: 10px;
    position: sticky;
    top: 8px;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  #family-progress .bar {
    height: 9px;
    background: #efe7d6;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 5px;
  }
  #family-progress .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), #7cc489);
    border-radius: 6px;
    transition: width 0.3s ease;
  }
  #family-progress .label { font-size: 0.82rem; font-weight: 600; }
  .emote-line { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .emote-line #emote-label { font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
  .emote-line .bar { flex: 1; margin-top: 0; }
  .bar.slim { height: 7px; }
  .fill.gold { background: linear-gradient(90deg, var(--gold), #f5c86a); }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
  }
  .kid-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    border-top: 4px solid var(--kc, #ccc);
  }
  .kid-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .kid-head h2 { font-size: 1rem; margin: 0; }
  .pills { display: flex; gap: 6px; }
  .pill {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .pill.stars { background: #fdf3dd; color: #b97f1a; border: 1px solid #f0dca8; }
  .pill.count { background: #f3ecdd; color: var(--muted); }
  .pill.count.done { color: #fff; background: var(--green); }
  .tier-line {
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 4px;
    min-height: 1.1em;
  }
  .tier-line b { color: var(--ink); }
  .section-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 8px 0 2px;
    font-weight: 700;
  }
  .chore {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 2px;
    border-bottom: 1px solid #f3ede0;
    cursor: pointer;
    user-select: none;
    min-height: 42px;
  }
  .chore:last-child { border-bottom: none; }
  .box {
    flex: 0 0 26px;
    width: 26px;
    height: 26px;
    border: 2px solid #c9bda9;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: transparent;
    background: #fff;
    transition: all 0.15s ease;
  }
  .chore.checked .box {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .chore .name { font-size: 0.85rem; line-height: 1.25; }
  .chore.checked .name { text-decoration: line-through; color: var(--muted); }
  #reset-btn {
    display: block;
    width: 100%;
    margin: 10px 0 12px;
    padding: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 2px dashed #d8cbb4;
    border-radius: 14px;
    cursor: pointer;
  }
  #reset-btn:active { background: #f3ecdd; }
  footer { text-align: center; color: var(--muted); font-size: 0.72rem; margin-bottom: 14px; }
  /* Perfect-day surprise modal */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #modal-overlay.show { display: flex; }
  #modal {
    background: #fff;
    border-radius: 22px;
    padding: 30px 26px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    animation: pop 0.35s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  #modal .trophy { font-size: 3.2rem; }
  #modal h3 { margin: 8px 0 4px; font-size: 1.3rem; }
  #modal .surprise-msg { font-size: 1.05rem; font-weight: 600; margin: 8px 0; line-height: 1.35; }
  #modal .emote-name { font-size: 1.5rem; font-weight: 800; color: #b97f1a; margin: 6px 0; line-height: 1.3; }
  #modal .star-note { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  #modal button {
    background: var(--gold);
    border: none;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 34px;
    border-radius: 30px;
    cursor: pointer;
  }
  .confetti {
    position: fixed;
    top: -16px;
    width: 10px;
    height: 14px;
    z-index: 60;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(112vh) rotate(720deg); }
  }
  #toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2d2a26;
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 70;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>☀️ Today's Chores</h1>
  <p id="date-line"></p>
</header>

<div id="family-progress">
  <div class="label" id="family-label">Family progress: 0 of 42</div>
  <div class="bar"><div class="fill" id="family-fill"></div></div>
  <div class="emote-line">
    <span id="emote-label">🕺 Emotes: 0/100</span>
    <div class="bar slim"><div class="fill gold" id="emote-fill"></div></div>
  </div>
</div>
<p class="rewards-note">Each chore = <b>1 ⭐</b> · Perfect day = <b>1 🕺 emote</b> · Ask Mom &amp; Dad what each tier earns! 🏆</p>

<div class="grid" id="cards"></div>

<button id="reset-btn">Reset Progress</button>
<footer>Checks &amp; stars save automatically on this device · Fresh checklist each morning · Stars are yours to keep ⭐</footer>

<div id="modal-overlay">
  <div id="modal">
    <div class="trophy" id="modal-trophy">🏆</div>
    <h3 id="modal-title">PERFECT DAY!</h3>
    <div class="emote-name" id="emote-name"></div>
    <div class="surprise-msg" id="surprise-msg"></div>
    <div class="star-note" id="modal-stars"></div>
    <button id="modal-claim">Claim ⭐</button>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var KIDS = [
    {
      name: "Lenny", icon: "⚽", color: "#4a90d9",
      morning: ["Eat breakfast", "Brush teeth", "Get dressed", "Pack backpack + snack", "Medicine", "Morning prayer"],
      evening: ["Homework", "Read", "Medicine", "Trash/recycling", "Put away clean clothes", "Tidy dining room table"],
      tiers: [
        { stars: 5,  label: "Rookie" },
        { stars: 15, label: "Epic Striker" },
        { stars: 30, label: "SIUUU Mode" },
        { stars: 50, label: "Ultimate Legend 🥏" }
      ],
      surprises: [
        "SIUUU! You went full Ronaldo today! ⚽",
        "EPIC! You bent it like a legend! 🥅",
        "OP! Ultimate frisbee champ energy! 🥏",
        "No cap — that was a legendary day! 🐐"
      ]
    },
    {
      name: "Rex", icon: "🐐", color: "#5aa469",
      morning: ["Eat breakfast", "Brush teeth", "Get dressed", "Pack backpack + snack", "Medicine", "Morning prayer"],
      evening: ["Homework", "Piano practice", "Read", "Medicine", "Math flashcards · 5 min", "Put away clean clothes", "Tidy basement"],
      tiers: [
        { stars: 5,  label: "Rookie" },
        { stars: 15, label: "Epic Playmaker" },
        { stars: 30, label: "Messi Mode: OP" },
        { stars: 50, label: "GOAT 🐐" }
      ],
      surprises: [
        "EPIC! Messi would be proud! ⚽",
        "OP! That left foot is pure magic! 🪄",
        "You ate and left NO crumbs! 🐐",
        "W dub! A perfect day! 🏆"
      ]
    },
    {
      name: "Etta", icon: "🤸", color: "#c86dd7",
      morning: ["Eat breakfast", "Brush teeth", "Get dressed", "Pack backpack + snack", "Vitamins", "Morning prayer"],
      evening: ["Homework", "Piano practice", "Read", "Put away clean clothes", "Tidy living room"],
      tiers: [
        { stars: 5,  label: "Rookie" },
        { stars: 15, label: "Epic Gymnast" },
        { stars: 30, label: "Stuck the Landing" },
        { stars: 50, label: "Gold Medalist 🥇" }
      ],
      surprises: [
        "EPIC! You stuck the landing! 🤸",
        "10/10! Gold medal vibes! 🥇",
        "Flawless! The judges are shook! ✨",
        "That was a perfect-10 routine! 💫"
      ]
    },
    {
      name: "Jack", icon: "🏀", color: "#e0784a",
      morning: ["🍽️ Unload dishwasher", "🥣 Eat breakfast", "🪥 Brush teeth", "💊 Vitamins"],
      evening: ["👟 Line up shoes", "🪥 Brush teeth"],
      tiers: [
        { stars: 5,  label: "Tiny Rookie" },
        { stars: 15, label: "Epic Ball Star" },
        { stars: 30, label: "OP Athlete" },
        { stars: 50, label: "Hall of Famer 🏆" }
      ],
      surprises: [
        "EPIC! Ball star! ⚽🏀🏈",
        "TOUCHDOWN! You did it! 🎉",
        "W! Little champ! 🏆",
        "So OP! Biggest high five! 🙌"
      ]
    }
  ];

  var EMOTES = [
    { name: "Griddy", icon: "🕺" },
    { name: "SIUUU", icon: "⚽" },
    { name: "Scuba Dive", icon: "🤿" },
    { name: "Split Jump", icon: "🤸" },
    { name: "Floss", icon: "🪩" },
    { name: "Orange Justice", icon: "🍊" },
    { name: "Worm", icon: "🐛" },
    { name: "Robot", icon: "🤖" },
    { name: "Dab", icon: "💪" },
    { name: "Moonwalk", icon: "🌙" },
    { name: "Penguin Waddle", icon: "🐧" },
    { name: "Superhero Landing", icon: "🦸" },
    { name: "Sprinkler", icon: "💦" },
    { name: "Chicken Dance", icon: "🐔" }
  ];

  var STORE_KEY = "kids-chores-dashboard-v2";
  var OLD_KEY = "kids-chores-dashboard-v1";

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function taskId(kidIdx, period, itemIdx) {
    return "k" + kidIdx + "-" + period.charAt(0) + itemIdx;
  }

  function kidIdxOf(id) { return parseInt(id.slice(1), 10); }

  function freshState() {
    var s = { date: todayStr(), checked: {}, awarded: [], celebrated: {}, stars: {}, perfect: {}, emotes: 0, centuries: 0 };
    for (var i = 0; i < KIDS.length; i++) { s.stars[i] = 0; s.perfect[i] = 0; }
    return s;
  }

  // One-time migration from v1: carry today's checks, grant stars for them.
  function migrateV1() {
    try {
      var raw = localStorage.getItem(OLD_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || d.date !== todayStr()) return null;
      return d.checked || {};
    } catch (e) { return null; }
  }

  function loadState() {
    var s = freshState();
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d) {
          if (d.emotes === undefined) {
            d.emotes = 0;
            for (var pi = 0; pi < KIDS.length; pi++) d.emotes += (d.perfect && d.perfect[pi]) || 0;
          }
          if (d.centuries === undefined) d.centuries = 0;
        }
        if (d && d.date === todayStr()) return d;
        // New day: keep lifetime stars, perfect-day counts & emotes, reset the rest.
        if (d) { s.stars = d.stars || s.stars; s.perfect = d.perfect || s.perfect; s.emotes = d.emotes || 0; s.centuries = d.centuries || 0; }
        saveState(s);
        return s;
      }
    } catch (e) {}
    var migrated = migrateV1();
    if (migrated) {
      s.checked = migrated;
      Object.keys(migrated).forEach(function (id) {
        if (!migrated[id]) return;
        var ki = kidIdxOf(id);
        s.awarded.push(id);
        s.stars[ki] = (s.stars[ki] || 0) + 1;
      });
    }
    saveState(s);
    return s;
  }

  function saveState(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
    catch (e) { /* storage unavailable; session-only fallback */ }
  }

  var S = loadState();

  function totalTasks() {
    return KIDS.reduce(function (n, k) { return n + k.morning.length + k.evening.length; }, 0);
  }

  function kidProgress(ki) {
    var kid = KIDS[ki], done = 0;
    ["morning", "evening"].forEach(function (period) {
      kid[period].forEach(function (_, ii) {
        if (S.checked[taskId(ki, period, ii)]) done++;
      });
    });
    return { done: done, total: kid.morning.length + kid.evening.length };
  }

  function tierFor(ki) {
    var stars = S.stars[ki] || 0, tiers = KIDS[ki].tiers, cur = null, next = null;
    tiers.forEach(function (t) {
      if (stars >= t.stars) cur = t; else if (!next) next = t;
    });
    return { cur: cur, next: next };
  }

  function updateUI() {
    var total = totalTasks();
    var done = Object.keys(S.checked).filter(function (id) { return S.checked[id]; }).length;
    document.getElementById("family-label").textContent = "Family progress: " + done + " of " + total;
    document.getElementById("family-fill").style.width = (total ? (done / total * 100) : 0) + "%";
    var em = (S.emotes || 0), emLabel = "🕺 Emotes: " + em + "/100";
    if (S.centuries > 0) emLabel += " 🏆×" + S.centuries;
    document.getElementById("emote-label").textContent = emLabel;
    document.getElementById("emote-fill").style.width = em + "%";

    KIDS.forEach(function (kid, ki) {
      var p = kidProgress(ki);
      var countEl = document.getElementById("count-" + ki);
      countEl.textContent = p.done + "/" + p.total;
      countEl.classList.toggle("done", p.done === p.total && p.total > 0);

      var starsEl = document.getElementById("stars-" + ki);
      starsEl.textContent = "⭐ " + (S.stars[ki] || 0);

      var t = tierFor(ki), tierEl = document.getElementById("tier-" + ki);
      var label = t.cur ? t.cur.label : "No tier yet";
      var toNext = t.next ? " · " + (t.next.stars - (S.stars[ki] || 0)) + " ⭐ to " + t.next.label : " · top tier! 🏆";
      tierEl.innerHTML = "";
      var b = document.createElement("b");
      b.textContent = label;
      tierEl.appendChild(b);
      tierEl.appendChild(document.createTextNode(toNext));
    });
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  function confetti() {
    var colors = ["#e0784a", "#5aa469", "#4a90d9", "#c86dd7", "#e8a93d", "#e05a7a"];
    for (var i = 0; i < 36; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (Math.random() * 100) + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
      c.style.animationDelay = (Math.random() * 0.6) + "s";
      document.body.appendChild(c);
      (function (el) {
        setTimeout(function () { el.remove(); }, 5000);
      })(c);
    }
  }

  function showSurprise(ki, emote, century) {
    var kid = KIDS[ki];
    var msg = kid.surprises[Math.floor(Math.random() * kid.surprises.length)];
    if (century) {
      document.getElementById("modal-trophy").textContent = "💯";
      document.getElementById("modal-title").textContent = "100 EMOTES!";
      document.getElementById("emote-name").textContent = "LEGENDARY FAMILY! 🏆×" + S.centuries;
      document.getElementById("surprise-msg").textContent = kid.name + " unlocked the " + emote.name + " " + emote.icon + " — the one that hit 100!";
      confetti(); confetti();
    } else {
      document.getElementById("modal-trophy").textContent = "🏆";
      document.getElementById("modal-title").textContent = "PERFECT DAY!";
      document.getElementById("emote-name").textContent = kid.name + " unlocked the " + emote.name + " " + emote.icon;
      document.getElementById("surprise-msg").textContent = msg;
    }
    var todayStars = S.awarded.filter(function (id) { return kidIdxOf(id) === ki; }).length;
    document.getElementById("modal-stars").textContent =
      "+" + todayStars + " ⭐ earned today · " + (S.stars[ki] || 0) + " ⭐ total · 🕺 " + S.emotes + "/100 emotes";
    document.getElementById("modal-overlay").classList.add("show");
    confetti();
  }

  document.getElementById("modal-claim").addEventListener("click", function () {
    document.getElementById("modal-overlay").classList.remove("show");
  });

  function toggle(id, ki, rowEl) {
    var wasChecked = !!S.checked[id];
    if (wasChecked) {
      delete S.checked[id];
    } else {
      S.checked[id] = true;
      if (S.awarded.indexOf(id) === -1) {
        S.awarded.push(id);
        var before = tierFor(ki).cur;
        S.stars[ki] = (S.stars[ki] || 0) + 1;
        var after = tierFor(ki).cur;
        if (after && after !== before) {
          toast("🎉 " + KIDS[ki].name + " unlocked: " + after.label + "!");
        }
      }
    }
    rowEl.classList.toggle("checked", !wasChecked);
    saveState(S);
    updateUI();

    // Perfect day = 1 emote, once per kid per day.
    var p = kidProgress(ki);
    if (!wasChecked && p.done === p.total && p.total > 0 && S.celebrated[ki] !== todayStr()) {
      S.celebrated[ki] = todayStr();
      S.perfect[ki] = (S.perfect[ki] || 0) + 1;
      var emote = EMOTES[Math.floor(Math.random() * EMOTES.length)];
      S.emotes = (S.emotes || 0) + 1;
      var century = false;
      if (S.emotes >= 100) {
        S.emotes -= 100;
        S.centuries = (S.centuries || 0) + 1;
        century = true;
      }
      saveState(S);
      updateUI();
      showSurprise(ki, emote, century);
    }
  }

  function render() {
    var wrap = document.getElementById("cards");
    wrap.innerHTML = "";

    KIDS.forEach(function (kid, ki) {
      var card = document.createElement("div");
      card.className = "kid-card";
      card.style.setProperty("--kc", kid.color);

      var head = document.createElement("div");
      head.className = "kid-head";
      var h2 = document.createElement("h2");
      h2.textContent = kid.icon + " " + kid.name;
      var pills = document.createElement("div");
      pills.className = "pills";
      var stars = document.createElement("span");
      stars.className = "pill stars";
      stars.id = "stars-" + ki;
      var count = document.createElement("span");
      count.className = "pill count";
      count.id = "count-" + ki;
      pills.appendChild(stars);
      pills.appendChild(count);
      head.appendChild(h2);
      head.appendChild(pills);
      card.appendChild(head);

      var tier = document.createElement("div");
      tier.className = "tier-line";
      tier.id = "tier-" + ki;
      card.appendChild(tier);

      [["morning", "☀️ Morning"], ["evening", "🌙 Evening"]].forEach(function (pair) {
        var period = pair[0], label = pair[1];
        var st = document.createElement("div");
        st.className = "section-title";
        st.textContent = label;
        card.appendChild(st);

        kid[period].forEach(function (name, ii) {
          var id = taskId(ki, period, ii);
          var row = document.createElement("div");
          row.className = "chore" + (S.checked[id] ? " checked" : "");
          var box = document.createElement("div");
          box.className = "box";
          box.textContent = "✓";
          var nm = document.createElement("div");
          nm.className = "name";
          nm.textContent = name;
          row.appendChild(box);
          row.appendChild(nm);
          row.addEventListener("click", function () { toggle(id, ki, row); });
          card.appendChild(row);
        });
      });

      wrap.appendChild(card);
    });

    updateUI();
  }

  document.getElementById("reset-btn").addEventListener("click", function () {
    if (!confirm("Clear today's checkmarks and start fresh? (Stars are kept ⭐)")) return;
    S.checked = {};
    S.awarded = [];
    S.celebrated = {};
    saveState(S);
    render();
  });

  var d = new Date();
  document.getElementById("date-line").textContent =
    d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  render();
})();
</script>
</body>
</html>
